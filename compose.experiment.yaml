services:
  tcp-metrics-experiment:
    build:
      context: .
      dockerfile: Dockerfile.experiment
    cap_add:
      - NET_ADMIN
    ports:
      - "8000:8000"
      - "8765:8765"
    volumes:
      - ./results:/app/results
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/web/player.html', timeout=1)"]
      interval: 5s
      timeout: 2s
      retries: 5

services:
  tcp-metrics:
    build: .
    ports:
      - "8000:8000"
      - "8765:8765"
    command:
      - python
      - scripts/tcp_info_signal_server.py
      - --host
      - 0.0.0.0
      - --serve-dir
      - /app
      - --cc
      - auto
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/web/player.html', timeout=1)"]
      interval: 5s
      timeout: 2s
      retries: 5
